name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev python3-dev ccache git libssl-dev libcairo2-dev pkg-config openjdk-17-jdk zip unzip lld libncurses5-dev libncursesw5-dev
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer "kivy>=2.2.0" kivymd

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug
